<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>2048 · Zen Garden</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system}

body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle at top,#0f172a,#020617 70%);
  color:#e5e7eb;
}

.game{
  width:340px;
  padding:22px;
  border-radius:32px;
  background:linear-gradient(180deg,#020617,#020617e6);
  box-shadow:
    0 40px 120px rgba(0,0,0,.9),
    inset 0 0 0 1px rgba(255,255,255,.04);
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}
.title{
  font-size:.85rem;
  letter-spacing:.12em;
  opacity:.6;
}
.score{
  font-size:.75rem;
  opacity:.4;
}

/* GRID */
.grid{
  position:relative;
  aspect-ratio:1;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

/* TILE */
.tile{
  border-radius:22px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-weight:600;
  animation:appear .22s ease;
  box-shadow:
    0 18px 40px rgba(0,0,0,.35),
    inset 0 0 0 1px rgba(255,255,255,.18);
}

@keyframes appear{
  from{transform:scale(.88);opacity:.3}
  to{transform:scale(1);opacity:1}
}

.tile span{
  font-size:1.4rem;
}
.tile small{
  font-size:.55rem;
  opacity:.45;
  margin-top:2px;
}

/* COLORS — muted & cohesive */
.v2    {background:linear-gradient(145deg,#1e293b,#334155)}
.v4    {background:linear-gradient(145deg,#1f2937,#374151)}
.v8    {background:linear-gradient(145deg,#312e81,#4338ca)}
.v16   {background:linear-gradient(145deg,#3b0764,#6b21a8)}
.v32   {background:linear-gradient(145deg,#581c87,#86198f)}
.v64   {background:linear-gradient(145deg,#7c2d12,#9a3412)}
.v128  {background:linear-gradient(145deg,#134e4a,#0f766e)}
.v256  {background:linear-gradient(145deg,#0f172a,#1e293b)}
.v512  {background:linear-gradient(145deg,#111827,#020617)}
.v1024 {background:linear-gradient(145deg,#365314,#4d7c0f)}
.v2048 {background:linear-gradient(145deg,#3f6212,#65a30d)}
</style>
</head>

<body>

<div class="game">
  <div class="header">
    <div class="title">2048 · ZEN</div>
    <div class="score" id="score">0</div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<script>
/* ===== AUDIO (barely audible, premium) ===== */
const ctx=new (window.AudioContext||window.webkitAudioContext)();
function softTone(v){
  const t=ctx.currentTime;
  const o=ctx.createOscillator();
  const g=ctx.createGain();
  o.type="sine";
  o.frequency.value=180+Math.log2(v)*40;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(.05,t+.02);
  g.gain.exponentialRampToValueAtTime(.001,t+.25);
  o.connect(g);g.connect(ctx.destination);
  o.start();o.stop(t+.3);
}

/* ===== DATA ===== */
const EMOJI={
  2:"🌱",4:"💧",8:"🌿",16:"🌸",32:"🌼",
  64:"🌳",128:"🍃",256:"☀️",512:"🌙",
  1024:"✨",2048:"🌈"
};

let board=Array(16).fill(0);
let score=0;

const grid=document.getElementById("grid");
const scoreEl=document.getElementById("score");

/* ===== CORE ===== */
function addTile(){
  const e=board.map((v,i)=>v?null:i).filter(v=>v!==null);
  if(!e.length) return;
  board[e[Math.random()*e.length|0]]=Math.random()<.9?2:4;
}

function slide(line){
  line=line.filter(v=>v);
  for(let i=0;i<line.length-1;i++){
    if(line[i]===line[i+1]){
      line[i]*=2;
      score+=line[i];
      softTone(line[i]);
      line[i+1]=0;
    }
  }
  return line.filter(v=>v);
}

function move(d){
  let moved=false;
  const copy=[...board];
  for(let i=0;i<4;i++){
    let line=[];
    for(let j=0;j<4;j++){
      const k=d<2?(d?i*4+3-j:i*4+j):(d===2?j*4+i:(3-j)*4+i);
      line.push(board[k]);
    }
    line=slide(line);
    while(line.length<4) line.push(0);
    for(let j=0;j<4;j++){
      const k=d<2?(d?i*4+3-j:i*4+j):(d===2?j*4+i:(3-j)*4+i);
      if(board[k]!==line[j]) moved=true;
      board[k]=line[j];
    }
  }
  if(moved){ addTile(); draw(); }
}

function draw(){
  grid.innerHTML="";
  board.forEach(v=>{
    const c=document.createElement("div");
    if(v){
      const t=document.createElement("div");
      t.className=`tile v${v}`;
      t.innerHTML=`<span>${EMOJI[v]}</span><small>${v}</small>`;
      c.appendChild(t);
    }
    grid.appendChild(c);
  });
  scoreEl.textContent=score;
}

/* ===== INPUT ===== */
window.addEventListener("keydown",e=>{
  ctx.resume();
  if(e.key==="ArrowLeft") move(0);
  if(e.key==="ArrowRight") move(1);
  if(e.key==="ArrowUp") move(2);
  if(e.key==="ArrowDown") move(3);
});

/* ===== START ===== */
addTile(); addTile(); draw();
</script>

</body>
</html>
