<!DOCTYPE html>
<html>
<body style="background:#000;overflow:hidden">
<script>
let s=0;
function spawn(){
  let d=document.createElement("div");
  d.style=`position:absolute;width:40px;height:40px;border-radius:50%;
           background:red;left:${Math.random()*(innerWidth-40)}px;
           top:${Math.random()*(innerHeight-40)}px`;
  document.body.appendChild(d);
  d.onclick=()=>{s++;d.remove();spawn();}
}
spawn();
</script>
</body>
</html>
