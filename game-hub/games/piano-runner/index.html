<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Music Garden</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(circle at top, #1e293b, #020617 70%);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: system-ui;
}

.scene {
  position: relative;
  width: min(700px, 96vw);
  height: min(500px, 90vh);
  border-radius: 32px;
  background: linear-gradient(180deg, #020617, #020617cc);
  box-shadow: 0 60px 160px rgba(0,0,0,.8);
  overflow: hidden;
}

/* Orbs */
.orb {
  position: absolute;
  width: 64px;
  height: 64px;
  border-radius: 50%;
  cursor: pointer;
  filter: drop-shadow(0 0 18px rgba(255,255,255,.4));
  transition: transform .15s;
}
.orb:active { transform: scale(.92); }

.orb[data-i="0"] { background: radial-gradient(circle,#bbf7d0,#22c55e); }
.orb[data-i="1"] { background: radial-gradient(circle,#bae6fd,#38bdf8); }
.orb[data-i="2"] { background: radial-gradient(circle,#fde68a,#facc15); }
.orb[data-i="3"] { background: radial-gradient(circle,#e9d5ff,#a855f7); }
.orb[data-i="4"] { background: radial-gradient(circle,#fecaca,#f87171); }

.glow {
  box-shadow: 0 0 30px 8px rgba(255,255,255,.8);
}

/* Hint text */
.hint {
  position:absolute;
  top:14px;
  width:100%;
  text-align:center;
  font-size:.75rem;
  opacity:.45;
  color:#e5e7eb;
}
</style>
</head>

<body>

<div class="scene">
  <div class="hint" id="hint">Watch the pattern</div>

  <div class="orb" data-i="0" style="left:14%;top:58%"></div>
  <div class="orb" data-i="1" style="left:32%;top:28%"></div>
  <div class="orb" data-i="2" style="left:52%;top:54%"></div>
  <div class="orb" data-i="3" style="left:70%;top:26%"></div>
  <div class="orb" data-i="4" style="left:44%;top:76%"></div>
</div>

<script>
/* ================= AUDIO ================= */
const ctx = new (window.AudioContext || window.webkitAudioContext)();
const SCALE = [261.63,293.66,329.63,392.00,440.00];

function playNote(freq) {
  const t = ctx.currentTime;
  const o1 = ctx.createOscillator();
  const o2 = ctx.createOscillator();
  const g = ctx.createGain();
  o1.type="triangle"; o2.type="sine";
  o1.frequency.value=freq;
  o2.frequency.value=freq*2;
  g.gain.setValueAtTime(0,t);
  g.gain.linearRampToValueAtTime(.18,t+.05);
  g.gain.exponentialRampToValueAtTime(.001,t+1.2);
  o1.connect(g); o2.connect(g); g.connect(ctx.destination);
  o1.start(); o2.start();
  o1.stop(t+1.3); o2.stop(t+1.3);
}

/* ================= GAME STATE ================= */
const orbs = [...document.querySelectorAll(".orb")];
const hintEl = document.getElementById("hint");

let pattern = [];
let input = [];
let acceptingInput = false;

/* ================= PATTERN ================= */
function newRound() {
  hintEl.textContent = "Watch the pattern";
  input = [];
  pattern.push(Math.floor(Math.random()*orbs.length));
  playPattern();
}

function playPattern() {
  acceptingInput = false;
  let i = 0;
  const interval = setInterval(()=>{
    if(i >= pattern.length) {
      clearInterval(interval);
      acceptingInput = true;
      hintEl.textContent = "Repeat the pattern";
      return;
    }
    const orb = orbs[pattern[i]];
    orb.classList.add("glow");
    playNote(SCALE[pattern[i]]);
    setTimeout(()=>orb.classList.remove("glow"),500);
    i++;
  },700);
}

/* ================= INPUT ================= */
orbs.forEach((orb,idx)=>{
  orb.addEventListener("click",()=>{
    ctx.resume();
    if(!acceptingInput) return;

    playNote(SCALE[idx]);
    input.push(idx);

    if(input[input.length-1] !== pattern[input.length-1]) {
      hintEl.textContent = "Try again";
      input = [];
      setTimeout(playPattern,1000);
      return;
    }

    if(input.length === pattern.length) {
      hintEl.textContent = "Nice ✨";
      setTimeout(newRound,1200);
    }
  });
});

/* ================= START ================= */
setTimeout(newRound,1000);
</script>

</body>
</html>
