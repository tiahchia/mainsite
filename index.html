<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Game Hub</title>

<style>
* {
  box-sizing: border-box;
  font-family: system-ui, -apple-system;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at top, #0f172a, #020617 70%);
  color: #e5e7eb;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* HEADER */
.header {
  text-align: center;
  padding: 48px 20px 32px;
}

.header h1 {
  margin: 0;
  font-size: 1.6rem;
  font-weight: 600;
  letter-spacing: 0.04em;
}

.header p {
  margin-top: 8px;
  font-size: 0.9rem;
  opacity: 0.6;
}

/* GRID */
.game-grid {
  width: 100%;
  max-width: 1100px;
  padding: 24px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 24px;
}

/* CARD */
.game-card {
  text-decoration: none;
  color: inherit;
  border-radius: 28px;
  overflow: hidden;
  background: linear-gradient(
    180deg,
    rgba(255,255,255,0.06),
    rgba(255,255,255,0.02)
  );
  box-shadow:
    0 30px 80px rgba(0,0,0,0.7),
    inset 0 0 0 1px rgba(255,255,255,0.06);
  transition: transform .25s ease, box-shadow .25s ease;
}

.game-card:hover {
  transform: translateY(-6px);
  box-shadow:
    0 40px 120px rgba(0,0,0,0.9),
    inset 0 0 0 1px rgba(255,255,255,0.12);
}

/* THUMBNAIL */
.thumb {
  height: 160px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.2rem;
}

/* INDIVIDUAL THEMES */
.t-2048   { background: linear-gradient(135deg,#1e293b,#312e81); }
.t-click  { background: linear-gradient(135deg,#134e4a,#0f766e); }
.t-music  { background: linear-gradient(135deg,#3b0764,#6b21a8); }
.t-math   { background: linear-gradient(135deg,#7c2d12,#9a3412); }

/* INFO */
.game-info {
  padding: 16px 18px 18px;
}

.game-info h3 {
  margin: 0;
  font-size: 1rem;
  font-weight: 600;
}

.game-info span {
  display: block;
  margin-top: 4px;
  font-size: 0.7rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  opacity: 0.5;
}
</style>
</head>

<body>

<header class="header">
  <h1>Game Hub</h1>
  <p>Thoughtful games · No ads · Offline friendly</p>
</header>

<main class="game-grid">

  <a href="games/2048/index.html" class="game-card">
    <div class="thumb t-2048">🧩</div>
    <div class="game-info">
      <h3>2048 · Zen</h3>
      <span>Logic</span>
    </div>
  </a>

  <a href="games/clicker/index.html" class="game-card">
    <div class="thumb t-click">🌱</div>
    <div class="game-info">
      <h3>Garden Growth</h3>
      <span>Idle</span>
    </div>
  </a>

  <a href="games/piano-runner/index.html" class="game-card">
    <div class="thumb t-music">🎵</div>
    <div class="game-info">
      <h3>Music Memory</h3>
      <span>Memory</span>
    </div>
  </a>

  <a href="games/math/index.html" class="game-card">
    <div class="thumb t-math">➗</div>
    <div class="game-info">
      <h3>Math Flow</h3>
      <span>Learning</span>
    </div>
  </a>

</main>

</body>
</html>
