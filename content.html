<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Template Showcase - Simple & Static</title>

  <!-- Swiper CSS -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
  />

  <style>
    body {
      margin: 0;
      font-family: "Helvetica Neue", Arial, sans-serif;
      background: #0d0d0d;
      color: #fff;
    }

    header {
      padding: 2rem;
      text-align: center;
    }

    header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    header p {
      color: #aaa;
      font-size: 1.2rem;
      margin: 0;
    }

    /* Swiper Container */
    .swiper {
      width: 100%;
      padding-top: 60px;
      padding-bottom: 100px;
    }

    /* Slides */
    .swiper-slide {
      background: #111;
      border-radius: 1rem;
      text-align: center;
      font-size: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease;
      width: 300px; /* fixed width for consistent 3D effect */
    }

    .swiper-slide img {
      display: block;
      width: 90%;
      height: auto;
      border-radius: 0.75rem;
      margin-bottom: 1rem;
    }

    .swiper-slide h5 {
      margin: 0;
      color: #fff;
      font-weight: 600;
    }

    /* Navigation arrows */
    .swiper-button-next,
    .swiper-button-prev {
      color: #fff;
      transition: color 0.3s;
    }
    .swiper-button-next:hover,
    .swiper-button-prev:hover {
      color: #4f46e5;
    }

    /* Pagination dots */
    .swiper-pagination-bullet {
      background: #777;
      opacity: 1;
    }
    .swiper-pagination-bullet-active {
      background: #4f46e5;
    }
  </style>
</head>
<body>
  <header>
    <h1>Template Showcase</h1>
    <p>Explore templates with a smooth 3D scroll effect</p>
  </header>

  <!-- Swiper -->
  <div class="swiper mySwiper">
    <div class="swiper-wrapper">
      <div class="swiper-slide">
        <img src="images/fulls/01.jpg" alt="Template 1" />
        <h5>Lounge</h5>
      </div>
      <div class="swiper-slide">
        <img src="images/fulls/02.jpg" alt="Template 2" />
        <h5>Studio</h5>
      </div>
      <div class="swiper-slide">
        <img src="images/fulls/03.jpg" alt="Template 3" />
        <h5>Business</h5>
      </div>
      <div class="swiper-slide">
        <img src="images/fulls/04.jpg" alt="Template 4" />
        <h5>Gallery</h5>
      </div>
      <!-- Add more slides as needed -->
    </div>

    <!-- Pagination & Navigation -->
    <div class="swiper-pagination"></div>
    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>
  </div>

  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script>
    var swiper = new Swiper(".mySwiper", {
      effect: "coverflow",
      grabCursor: true,
      centeredSlides: true,
      slidesPerView: "auto",
      loop: true,
      coverflowEffect: {
        rotate: 40,
        stretch: 0,
        depth: 150,
        modifier: 1,
        slideShadows: true,
      },
      pagination: {
        el: ".swiper-pagination",
        clickable: true,
      },
      navigation: {
        nextEl: ".swiper-button-next",
        prevEl: ".swiper-button-prev",
      },
    });
  </script>
</body>
</html>
